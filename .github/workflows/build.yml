name: Build & Release Thermal-X

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Bisa dijalankan manual kapan saja

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==================== MODULE MAGISK ====================
      - name: Build Magisk Module
        run: |
          cd thermal-X-magisk
          zip -r ../Thermal-X-Magisk-$(date +%Y%m%d).zip \
            module.prop service.sh post-fs-data.sh system.prop uninstall.sh
          ls -la

      # ==================== MODULE KERNELSU ====================
      - name: Build KernelSU Module
        run: |
          cd thermal-X-kernelsu
          zip -r ../Thermal-X-KernelSU-$(date +%Y%m%d).zip \
            module.prop service.sh post-fs-data.sh system.prop uninstall.sh
          ls -la

      # ==================== ANDROID APP ====================
      - name: Build Android App
        run: |
          cd thermal-X-app
          ./gradlew assembleRelease --stacktrace

      # ==================== UPLOAD TO RELEASES ====================
      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Thermal-X-Release
          path: |
            *.zip
            *.apk
            thermal-X-app/app/build/outputs/apk/release/*.apk
            thermal-X-app/app/build/outputs/apk/release/*.aab
