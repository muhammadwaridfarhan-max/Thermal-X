name: Build & Release Thermal-X KernelSU + App

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Bisa dijalankan manual kapan saja

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================== BUAT FOLDER DAN FILE APP ====================
      - name: Create app folder and files
        run: |
          mkdir -p thermal-x-app/app/src/main/java/com/thermalx/app
          mkdir -p thermal-x-app/app/src/main/res/layout
          mkdir -p thermal-x-app/app/src/main/res/values

          cat > thermal-x-app/build.gradle << 'EOF'
plugins {
    id 'com.android.application' version '8.5.2'
}
allprojects {
    repositories { google(); mavenCentral(); }
}
EOF

          cat > thermal-x-app/app/build.gradle << 'EOF'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.23'
}

android {
    namespace 'com.thermalx.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.thermalx.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
EOF

          cat > thermal-x-app/app/src/main/AndroidManifest.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
    <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="Thermal-X"
        android:theme="@style/Theme.ThermalX">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          cat > thermal-x-app/app/src/main/java/com/thermalx/app/MainActivity.kt << 'EOF'
package com.thermalx.app
import android.content.Intent
import android.os.Bundle
import androidx.appcompat.app.AppCompatActivity
import com.google.android.material.materialswitch.MaterialSwitch
import com.google.android.material.button.MaterialButton
class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)
        val btnMagisk: MaterialButton = findViewById(R.id.btnMagisk)
        val btnKernelsu: MaterialButton = findViewById(R.id.btnKernelsu)
        val switchThermal: MaterialSwitch = findViewById(R.id.switchThermal)
        val switchFastCharge: MaterialSwitch = findViewById(R.id.switchFastCharge)
        btnMagisk.setOnClickListener { startActivity(Intent(this, ModuleActivity::class.java).apply { putExtra("module", "magisk") }) }
        btnKernelsu.setOnClickListener { startActivity(Intent(this, ModuleActivity::class.java).apply { putExtra("module", "kernelsu") }) }
        switchThermal.setOnCheckedChangeListener { _, isChecked -> toggleThermal(isChecked) }
        switchFastCharge.setOnCheckedChangeListener { _, isChecked -> toggleFastCharge(isChecked) }
    }
    private fun toggleThermal(enable: Boolean) {}
    private fun toggleFastCharge(enable: Boolean) {}
}
EOF

          cat > thermal-x-app/app/src/main/res/values/strings.xml << 'EOF'
<string name="app_name">Thermal-X</string>
EOF

          cat > thermal-x-app/app/src/main/res/layout/activity_main.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:padding="24dp">
    <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Thermal-X" android:textSize="32sp" android:textStyle="bold" android:gravity="center" android:layout_marginBottom="32dp"/>
    <Button android:id="@+id/btnMagisk" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Magisk Module" android:backgroundTint="#3F51B5"/>
    <Button android:id="@+id/btnKernelsu" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="KernelSU Module" android:layout_marginTop="12dp" android:backgroundTint="#4CAF50"/>
    <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Toggle Thermal Throttling" android:textSize="18sp" android:layout_marginTop="32dp"/>
    <MaterialSwitch android:id="@+id/switchThermal" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Thermal Throttling (ON/OFF)" android:layout_marginTop="8dp"/>
    <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Toggle Fast Charging" android:textSize="18sp" android:layout_marginTop="24dp"/>
    <MaterialSwitch android:id="@+id/switchFastCharge" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Fast Charging (ON/OFF)" android:layout_marginTop="8dp"/>
</LinearLayout>
EOF

          cat > thermal-x-app/app/src/main/res/values/styles.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="Theme.ThermalX" parent="Theme.Material3.DayNight.NoActionBar">
        <item name="colorPrimary">@color/colorPrimary</item>
        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
        <item name="colorAccent">@color/colorAccent</item>
    </style>
</resources>
EOF

          cat > thermal-x-app/app/src/main/res/values/colors.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="colorPrimary">#3F51B5</color>
    <color name="colorPrimaryDark">#1A237E</color>
    <color name="colorAccent">#FF4081</color>
</resources>
EOF

      # ==================== MODULE KERNELSU ====================
      - name: Create KernelSU module
        run: |
          mkdir -p thermal-X-kernelsu
          cat > thermal-X-kernelsu/module.prop << 'EOF'
id=thermal-x-kernelsu
name=Thermal-X KernelSU
version=1.0
versionCode=1
author=muhammadwaridfarhan-max
description=ON/OFF Thermal + Fast Charging for KernelSU
EOF
          cat > thermal-X-kernelsu/service.sh << 'EOF'
#!/system/bin/sh
MODDIR=${0%/*}
THERMAL_PATH=$(find /proc -name "thermal_zone*" 2>/dev/null | head -n1)
if [ -n "$THERMAL_PATH" ] && [ -d "$THERMAL_PATH" ]; then
    echo "1" > "$THERMAL_PATH/temp" 2>/dev/null || true
    echo "Thermal-X Disabled" > "$THERMAL_PATH/type" 2>/dev/null || true
fi
if [ -d /sys/class/power_supply/battery ]; then
    echo "0" > /sys/class/power_supply/battery/force_fast_charge 2>/dev/null || true
    echo "1" > /sys/class/power_supply/battery/force_fast_charge 2>/dev/null || true
fi
if [ -f /sys/module/qti_power_on/parameters/fast_charge ]; then
    echo "1" > /sys/module/qti_power_on/parameters/fast_charge 2>/dev/null || true
fi
echo "[Thermal-X KernelSU] Thermal & Fast Charging sudah di-disable" > $MODDIR/log.txt
EOF
          cat > thermal-X-kernelsu/post-fs-data.sh << 'EOF'
#!/system/bin/sh
true
EOF
          cat > thermal-X-kernelsu/system.prop << 'EOF'
ro.config.hwfast=1
ro.config.hwthermal=0
persist.sys.hwthermal=0
persist.sys.hwfastcharge=1
EOF
          cat > thermal-X-kernelsu/uninstall.sh << 'EOF'
#!/system/bin/sh
rm -rf /system/etc/thermal-x /data/thermal-x 2>/dev/null
EOF

      # ==================== BUILD ====================
      - name: Build Module & App
        run: |
          cd thermal-X-kernelsu
          zip -r ../Thermal-X-KernelSU-$(date +%Y%m%d).zip module.prop service.sh post-fs-data.sh system.prop uninstall.sh
          cd ..
          cd thermal-x-app
          ./gradlew assembleRelease --stacktrace

      # ==================== UPLOAD ====================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Thermal-X-Release
          path: |
            *.zip
            *.apk
            thermal-x-app/app/build/outputs/apk/release/*.apk
            thermal-x-app/app/build/outputs/apk/release/*.aab
