name: Build & Release Thermal-X KernelSU + App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==================== BUAT FOLDER DAN FILE APP ====================
      - name: Create app folder and files
        run: |
          mkdir -p thermal-x-app/app/src/main/java/com/thermalx/app
          mkdir -p thermal-x-app/app/src/main/res/layout
          mkdir -p thermal-x-app/app/src/main/res/values

          cat > thermal-x-app/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Thermal-X"
          include ':app'
          EOF

          cat > thermal-x-app/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > thermal-x-app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
          }
          EOF

          cat > thermal-x-app/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.thermalx.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.thermalx.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > thermal-x-app/app/proguard-rules.pro << 'EOF'
          # no custom rules
          EOF

          cat > thermal-x-app/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Thermal-X"
                  android:theme="@style/Theme.ThermalX">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".ModuleActivity" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > thermal-x-app/app/src/main/java/com/thermalx/app/MainActivity.kt << 'EOF'
          package com.thermalx.app

          import android.content.Intent
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton
          import com.google.android.material.materialswitch.MaterialSwitch

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val btnMagisk: MaterialButton = findViewById(R.id.btnMagisk)
                  val btnKernelsu: MaterialButton = findViewById(R.id.btnKernelsu)
                  val switchThermal: MaterialSwitch = findViewById(R.id.switchThermal)
                  val switchFastCharge: MaterialSwitch = findViewById(R.id.switchFastCharge)
                  btnMagisk.setOnClickListener {
                      startActivity(Intent(this, ModuleActivity::class.java).apply { putExtra("module", "magisk") })
                  }
                  btnKernelsu.setOnClickListener {
                      startActivity(Intent(this, ModuleActivity::class.java).apply { putExtra("module", "kernelsu") })
                  }
                  switchThermal.setOnCheckedChangeListener { _, isChecked -> toggleThermal(isChecked) }
                  switchFastCharge.setOnCheckedChangeListener { _, isChecked -> toggleFastCharge(isChecked) }
              }

              private fun toggleThermal(enable: Boolean) {}
              private fun toggleFastCharge(enable: Boolean) {}
          }
          EOF

          cat > thermal-x-app/app/src/main/java/com/thermalx/app/ModuleActivity.kt << 'EOF'
          package com.thermalx.app

          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class ModuleActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val name = intent.getStringExtra("module") ?: "unknown"
                  val tv = TextView(this)
                  tv.text = "Module: $name"
                  tv.textSize = 24f
                  tv.setPadding(48, 48, 48, 48)
                  setContentView(tv)
              }
          }
          EOF

          cat > thermal-x-app/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Thermal-X</string>
          </resources>
          EOF

          cat > thermal-x-app/app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Thermal-X"
                  android:textSize="32sp"
                  android:textStyle="bold"
                  android:gravity="center"
                  android:layout_marginBottom="32dp" />

              <com.google.android.material.button.MaterialButton
                  android:id="@+id/btnMagisk"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Magisk Module" />

              <com.google.android.material.button.MaterialButton
                  android:id="@+id/btnKernelsu"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="KernelSU Module"
                  android:layout_marginTop="12dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Toggle Thermal Throttling"
                  android:textSize="18sp"
                  android:layout_marginTop="32dp" />

              <com.google.android.material.materialswitch.MaterialSwitch
                  android:id="@+id/switchThermal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Thermal Throttling (ON/OFF)"
                  android:layout_marginTop="8dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Toggle Fast Charging"
                  android:textSize="18sp"
                  android:layout_marginTop="24dp" />

              <com.google.android.material.materialswitch.MaterialSwitch
                  android:id="@+id/switchFastCharge"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Fast Charging (ON/OFF)"
                  android:layout_marginTop="8dp" />
          </LinearLayout>
          EOF

          cat > thermal-x-app/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ThermalX" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
              </style>
          </resources>
          EOF

          cat > thermal-x-app/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#3F51B5</color>
              <color name="colorPrimaryDark">#1A237E</color>
              <color name="colorAccent">#FF4081</color>
          </resources>
          EOF

      # ==================== MODULE KERNELSU ====================
      - name: Create KernelSU module
        run: |
          mkdir -p thermal-X-kernelsu

          cat > thermal-X-kernelsu/module.prop << 'EOF'
          id=thermal-x-kernelsu
          name=Thermal-X KernelSU
          version=1.0
          versionCode=1
          author=muhammadwaridfarhan-max
          description=ON/OFF Thermal + Fast Charging for KernelSU
          EOF

          cat > thermal-X-kernelsu/service.sh << 'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          THERMAL_PATH=$(find /proc -name "thermal_zone*" 2>/dev/null | head -n1)
          if [ -n "$THERMAL_PATH" ] && [ -d "$THERMAL_PATH" ]; then
              echo "1" > "$THERMAL_PATH/temp" 2>/dev/null || true
              echo "Thermal-X Disabled" > "$THERMAL_PATH/type" 2>/dev/null || true
          fi
          if [ -d /sys/class/power_supply/battery ]; then
              echo "0" > /sys/class/power_supply/battery/force_fast_charge 2>/dev/null || true
              echo "1" > /sys/class/power_supply/battery/force_fast_charge 2>/dev/null || true
          fi
          if [ -f /sys/module/qti_power_on/parameters/fast_charge ]; then
              echo "1" > /sys/module/qti_power_on/parameters/fast_charge 2>/dev/null || true
          fi
          echo "[Thermal-X KernelSU] Thermal & Fast Charging sudah di-disable" > $MODDIR/log.txt
          EOF

          cat > thermal-X-kernelsu/post-fs-data.sh << 'EOF'
          #!/system/bin/sh
          true
          EOF

          cat > thermal-X-kernelsu/system.prop << 'EOF'
          ro.config.hwfast=1
          ro.config.hwthermal=0
          persist.sys.hwthermal=0
          persist.sys.hwfastcharge=1
          EOF

          cat > thermal-X-kernelsu/uninstall.sh << 'EOF'
          #!/system/bin/sh
          rm -rf /system/etc/thermal-x /data/thermal-x 2>/dev/null
          EOF

      # ==================== BUILD ====================
      - name: Zip KernelSU module
        run: |
          cd thermal-X-kernelsu
          zip -r ../Thermal-X-KernelSU-$(date +%Y%m%d).zip module.prop service.sh post-fs-data.sh system.prop uninstall.sh

      - name: Build APK
        working-directory: thermal-x-app
        run: gradle assembleRelease --stacktrace

      # ==================== UPLOAD ====================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Thermal-X-Release
          path: |
            *.zip
            thermal-x-app/app/build/outputs/apk/release/*.apk
