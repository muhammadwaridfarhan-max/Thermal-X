name: Build & Release Thermal-X

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Magisk Module
        run: |
          cd thermal-X-magisk
          zip -r ../Thermal-X-Magisk-$(date +%Y%m%d).apk module.prop service.sh post-fs-data.sh system.prop uninstall.sh

      - name: Build KernelSU Module
        run: |
          cd thermal-X-kernelsu
          zip -r ../Thermal-X-KernelSU-$(date +%Y%m%d).apk module.prop service.sh post-fs-data.sh system.prop uninstall.sh

      - name: Build Android App
        run: |
          cd thermal-X-app
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Thermal-X-Release
          path: |
            *.apk
            thermal-X-app/app/build/outputs/apk/release/*.apk
